<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/CSS/estiloContactos.css">
</head>
<body>
    <header>

        <div class="header-container">
            <img src="/imagenes/EspacioTech.png" alt="Cabecera Espacio Tech - HTML Master Class" class="header-img">
        </div>

        
        <nav class="navbar">
            <ul class="nav-list">
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/HTML/quienesSomos.html">¿Quiénes somos?</a></li>
                <!-- <li><a href="/HTML/contactos.html" target="_blank" rel="noopener noreferrer">Contacto</a></li> -->
            </ul>
        </nav>
    </header>

    <section class="form-container">
    <form action="#" method="POST" class="contact-form">
        <h2>Envíame un mensaje</h2>
        
        <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="¿En qué puedo ayudarte?">
        </div>

        <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar Mensaje</button>
    </form>
</section>

</body>
</html>
